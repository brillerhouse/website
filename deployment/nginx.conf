server {
    listen 8080;
    server_name briller.house www.briller.house;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Cloud Run terminates HTTPS before forwarding to this HTTP listener.
    # Relative redirects preserve the browser's public scheme, hostname and port.
    absolute_redirect off;
    if ($host = www.briller.house) { return 301 https://briller.house$request_uri; }
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.facebook.com; font-src 'self'; connect-src 'self' https://api.country.is https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.facebook.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = / { return 302 /en/; }
    location = /blog { return 301 /en/blog/$is_args$args; }
    location ~ ^/blog/(.*)$ { return 301 /en/blog/$1$is_args$args; }
    location = /en { return 301 /en/; }
    location = /uk { return 301 /uk/; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}

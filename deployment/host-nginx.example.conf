# Insert into your existing TLS-enabled reverse proxy configuration.
# TLS certificate paths and the existing build.briller.house upstream remain yours.
# Do not replace the app's current configuration with this example.
server {
    listen 80;
    server_name briller.house www.briller.house;
    return 301 https://briller.house$request_uri;
}
server {
    listen 443 ssl;
    server_name www.briller.house;
    ssl_certificate /etc/letsencrypt/live/briller.house/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/briller.house/privkey.pem;
    return 301 https://briller.house$request_uri;
}
server {
    listen 443 ssl;
    server_name briller.house;
    ssl_certificate /etc/letsencrypt/live/briller.house/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/briller.house/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
